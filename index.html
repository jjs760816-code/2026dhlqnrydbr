<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5학년 통합일정 캘린더 연결 중</title><style>body{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;background:#eef1f4;color:#222a31;text-align:center;padding:48px 18px}.box{max-width:600px;margin:auto;background:#fff;border:1px solid #e0e4e9;border-radius:16px;padding:28px;box-shadow:0 8px 24px rgba(28,40,51,.06)}.sub{color:#69737d;font-size:14px;margin-top:8px}</style></head><body><div class="box"><b>5학년 통합일정 캘린더</b><div class="sub" id="msg">공유 일정을 안전하게 연결하는 중입니다…</div></div><script>
(async()=>{
  const fail=(e)=>{console.error(e);document.getElementById('msg').innerHTML='업데이트 화면을 불러오지 못했습니다.<br>기존 화면으로 이동합니다.';setTimeout(()=>location.replace('app-base.html'),1000);};
  try{
    const res=await fetch('app-base.html?v=20260929-share2',{cache:'no-store'});
    if(!res.ok) throw new Error('base HTTP '+res.status);
    let src=await res.text();
    const replace=(a,b,name)=>{if(!src.includes(a))throw new Error('patch missing: '+name);src=src.replace(a,b);};

    replace('<button class="btn" id="serverBtn">🔧 공유 서버 연결</button>', '<button class="btn" id="serverBtn">🌐 공유 저장 연결됨</button>\n    <button class="btn" id="shareBtn">🔗 공유 링크 복사</button>', 'share buttons');
    replace('let serverUrl=DEFAULT_SERVER; try{ serverUrl=localStorage.getItem(SERVER_KEY)||DEFAULT_SERVER; }catch(e){}', 'let serverUrl=DEFAULT_SERVER; // 공용 사이트에서는 저장 서버를 자동 고정 연결', 'server override');
    replace('let state={ events: clone(DEFAULT) };', 'let state={ events: clone(DEFAULT) };\nlet baseEvents=[]; // 마지막으로 서버에서 확인한 기준본(동시 수정 병합용)', 'base snapshot');

    const oldSave=`async function save(){
  // 어떤 모드든 이 기기에 백업본을 남김(서버가 잠시 안 될 때 대비)
  try{ localStorage.setItem(KEY,JSON.stringify(state.events)); }catch(e){ if(mode()==='local') canSave=false; }
  if(mode()==='ws'){
    try{ await window.storage.set(KEY, JSON.stringify(state.events), true); lastSync='마지막 저장 '+nowT(); }
    catch(e){ lastSync='⚠ 공유 저장 실패 — 잠시 후 다시 시도해 주세요'; }
  } else if(mode()==='server'){
    try{
      const res=await fetch(serverUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(state.events)});
      if(!res.ok) throw 0;
      lastSync='서버 저장 '+nowT();
    }catch(e){ lastSync='⚠ 서버 저장 실패 — 인터넷·주소 확인 (이 기기에는 저장됨)'; }
  }
  updateHint();
}`;
    const newSave=`function sameEvent(a,b){ try{return JSON.stringify(a)===JSON.stringify(b);}catch(e){return false;} }
function mergeLocalChanges(base,local,remote){
  const bm=new Map((base||[]).filter(x=>x&&x.id).map(x=>[x.id,x]));
  const lm=new Map((local||[]).filter(x=>x&&x.id).map(x=>[x.id,x]));
  let out=clone(remote||[]);
  const pos=()=>new Map(out.filter(x=>x&&x.id).map((x,i)=>[x.id,i]));
  for(const [id,b] of bm){
    if(!lm.has(id)){ out=out.filter(x=>x.id!==id); continue; }
    const l=lm.get(id);
    if(!sameEvent(l,b)){
      const p=pos(); if(p.has(id)) out[p.get(id)]=clone(l); else out.push(clone(l));
    }
  }
  for(const [id,l] of lm){
    if(!bm.has(id)){
      const p=pos(); if(p.has(id)) out[p.get(id)]=clone(l); else out.push(clone(l));
    }
  }
  return out;
}
async function fetchServerEvents(){
  const r=await fetch(serverUrl+(serverUrl.indexOf('?')>=0?'&':'?')+'t='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d=JSON.parse(await r.text());
  return Array.isArray(d)?d:[];
}
async function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(state.events)); }catch(e){ if(mode()==='local') canSave=false; }
  if(mode()==='ws'){
    try{ await window.storage.set(KEY, JSON.stringify(state.events), true); baseEvents=clone(state.events); lastSync='공유 저장 '+nowT(); }
    catch(e){ lastSync='⚠ 공유 저장 실패 — 브라우저 백업은 유지됨'; }
  } else if(mode()==='server'){
    try{
      let outgoing=state.events;
      try{ const latest=await fetchServerEvents(); outgoing=mergeLocalChanges(baseEvents,state.events,latest); }catch(e){ console.warn('pre-save sync failed',e); }
      const res=await fetch(serverUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(outgoing)});
      if(!res.ok) throw new Error('HTTP '+res.status);
      state.events=outgoing; baseEvents=clone(outgoing);
      try{ localStorage.setItem(KEY,JSON.stringify(state.events)); }catch(e){}
      lastSync='온라인 저장 '+nowT(); renderAll();
    }catch(e){ console.warn('server save failed',e); lastSync='⚠ 온라인 저장 실패 — 이 기기 백업은 유지됨'; }
  }
  updateHint();
}`;
    replace(oldSave,newSave,'safe save');

    replace("if(d){ state.events=d; renderAll(); lastSync='최신 일정 받음 '+nowT(); if(showMsg) alert('최신 공유 일정을 불러왔습니다.'); }", "if(d){ state.events=d; baseEvents=clone(d); try{localStorage.setItem(KEY,JSON.stringify(state.events));}catch(e){} renderAll(); lastSync='최신 일정 받음 '+nowT(); if(showMsg) alert('최신 공유 일정을 불러왔습니다.'); }", 'sync snapshot');

    const oldHint=`  } else if(m==='server'){
    el.textContent='🌐 서버 공유 모드: 수정하면 자동으로 서버에 저장되어, 같은 서버를 연결한 모든 기기·브라우저에 반영됩니다. '+(lastSync?'('+lastSync+')':'');`;
    const newHint=`  } else if(m==='server'){
    el.textContent='🌐 온라인 공동 일정: 주소 입력 없이 자동 공유 · 수정 시 서버+이 기기에 함께 저장됩니다. '+(lastSync?'('+lastSync+')':'');`;
    replace(oldHint,newHint,'hint');

    replace("sv.textContent=serverUrl?'🔧 서버 연결됨 (변경)':'🔧 공유 서버 연결';", "sv.textContent='🌐 공유 저장 연결됨';", 'server button label');

    const oldServer=`document.getElementById('serverBtn').onclick=async ()=>{
  const u=prompt('공유 서버 주소(Apps Script 웹앱 URL)를 붙여넣으세요.\\n예: https://script.google.com/macros/s/…/exec\\n(비우고 확인하면 연결 해제 → 개인 모드)', serverUrl);
  if(u===null) return;
  serverUrl=u.trim();
  try{ localStorage.setItem(SERVER_KEY, serverUrl); }catch(e){}
  applyModeUI();
  if(serverUrl){
    const d=await loadEvents();
    if(d){ state.events=d; renderAll(); alert('서버에 연결했습니다. 최신 공유 일정을 불러왔어요.'); }
    else { await save(); alert('서버에 연결했습니다. 현재 일정을 서버에 처음으로 저장했어요.\\n같은 주소를 동학년 선생님들께 알려주시면 함께 쓸 수 있습니다.'); }
  }
  updateHint();
};`;
    const newServer=`document.getElementById('serverBtn').onclick=()=>syncNow(true);
document.getElementById('shareBtn').onclick=async()=>{
  const link=location.origin+location.pathname;
  try{ await navigator.clipboard.writeText(link); alert('공유 링크를 복사했습니다. 동학년 선생님께 이 주소만 보내면 됩니다.'); }
  catch(e){ prompt('아래 주소를 복사해 주세요.',link); }
};`;
    replace(oldServer,newServer,'server click');

    replace("document.getElementById('resetBtn').onclick=()=>{ if(!confirm('기본 학사일정으로 되돌립니다. 지금까지 수정한 내용은 사라집니다.')) return; state.events=clone(DEFAULT); save(); renderAll(); };", "document.getElementById('resetBtn').onclick=()=>{ if(!confirm('⚠ 공동 일정 전체를 기본 상태로 되돌립니다. 다른 선생님의 수정 내용도 사라질 수 있습니다. 계속할까요?')) return; if(!confirm('정말 초기화할까요? 필요하면 먼저 [내보내기]로 백업해 주세요.')) return; state.events=clone(DEFAULT); save(); renderAll(); };", 'safe reset');

    replace("if(d){ state.events=d; renderAll(); }\n  else if(mode()!=='local'){ await save(); }", "if(d){ state.events=d; baseEvents=clone(d); try{localStorage.setItem(KEY,JSON.stringify(state.events));}catch(e){} renderAll(); }\n  else if(mode()!=='local'){ baseEvents=[]; await save(); }", 'init snapshot');

    replace("window.addEventListener('focus', ()=>{ if(mode()!=='local' && !M.classList.contains('on')) syncNow(false); });", "window.addEventListener('focus', ()=>{ if(mode()!=='local' && !M.classList.contains('on')) syncNow(false); });\nsetInterval(()=>{ if(mode()!=='local' && !M.classList.contains('on') && document.visibilityState==='visible') syncNow(false); },30000);", 'periodic sync');

    src=src.replace('<p><b>🌐 서버 공유 모드 (추천)</b> — <b>[🔧 공유 서버 연결]</b>에 서버 주소를 한 번 넣어두면, 이 파일을 <b>어떤 브라우저·어떤 기기에서 열어도</b> 모두가 같은 일정 하나를 보고 함께 수정합니다. 수정은 자동 저장되고, 다른 사람의 수정은 화면에 다시 돌아올 때 자동으로(또는 [최신 일정 받기]로) 반영됩니다. 서버는 선생님 구글 계정으로 5분 만에 무료로 만들 수 있습니다(함께 드린 설치 안내 참고). 주소를 아는 사람은 누구나 보고 고칠 수 있으니 동학년에게만 알려주세요.</p>', '<p><b>🌐 온라인 공동 일정</b> — 서버 주소는 이미 자동 연결되어 있습니다. 동학년 선생님께는 <b>현재 사이트 주소 하나만 공유</b>하면 됩니다. 누구든 일정을 추가·수정하면 온라인과 각 기기 브라우저에 함께 저장되며, 다른 사람의 변경도 자동으로 다시 불러옵니다.</p>');

    document.open(); document.write(src); document.close();
  }catch(e){fail(e);}
})();
</script></body></html>
